<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="diagramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#diagramBg)"/>

  <!-- Title -->
  <text x="500" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">
    IETF RFC 6455 WebSocket Architecture &amp; Framing Protocol
  </text>
  <text x="500" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    Frame Header Anatomy, 4-Byte XOR Masking &amp; Handshake Cryptographic Derivation
  </text>

  <!-- 1. Frame Header -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="840" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      WebSocket Frame Header (RFC 6455 Section 5.2)
    </text>

    <!-- Byte 0 -->
    <rect x="30" y="45" width="370" height="45" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="215" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Byte 0: FIN (1b) | RSV1..3 (3b) | Opcode (4b)
    </text>
    <text x="215" y="82" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">
      FIN=1 | RSV=000 | 0x1 (Text) / 0x2 (Binary) / 0x8 (Close)
    </text>

    <!-- Byte 1 -->
    <rect x="420" y="45" width="390" height="45" rx="4" fill="#6d28d9" stroke="#a78bfa"/>
    <text x="615" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Byte 1: MASK (1b) | Payload Length (7b, 16b, or 64b)
    </text>
    <text x="615" y="82" fill="#ede9fe" font-family="monospace" font-size="10" text-anchor="middle">
      MASK=1 (Client Mandate) | Len &lt;= 125, 126 (+2B), 127 (+8B)
    </text>
  </g>

  <!-- 2. Handshake Derivation -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="840" height="140" rx="8" fill="#0f172a" stroke="#2a3a53"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      HTTP/1.1 101 Handshake Key Derivation (RFC 6455 Section 4.2.2)
    </text>

    <text x="40" y="55" fill="#38bdf8" font-family="monospace" font-size="12">
      Client: Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
    </text>
    <text x="40" y="78" fill="#94a3b8" font-family="monospace" font-size="11">
      Concat: "dGhlIHNhbXBsZSBub25jZQ==" + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11" (RFC GUID)
    </text>
    <text x="40" y="100" fill="#f59e0b" font-family="monospace" font-size="11">
      Hash:   SHA-1(Concatenated String) → [0xb3, 0x7a, 0x4f, 0x2c, 0xc0, ...] (20 Bytes)
    </text>
    <text x="40" y="122" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">
      Server: Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo= (Base64 Encoded)
    </text>
  </g>

  <!-- 3. XOR Masking -->
  <g transform="translate(80, 385)">
    <rect x="0" y="0" width="840" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      Client-to-Server 4-Byte XOR Masking (RFC 6455 Section 5.3)
    </text>

    <text x="40" y="55" fill="#eab308" font-family="monospace" font-size="12">
      Formula: transformed_octet[i] = original_octet[i] XOR masking_key[i % 4]
    </text>
    <text x="40" y="80" fill="#f1f5f9" font-family="monospace" font-size="11">
      • Original Payload: "Hello" → [0x48 ('H'), 0x65 ('e'), 0x6C ('l'), 0x6C ('l'), 0x6F ('o')]
    </text>
    <text x="40" y="102" fill="#94a3b8" font-family="monospace" font-size="11">
      • Masking Key:      [0x37, 0xFA, 0x21, 0x3D]
    </text>
    <text x="40" y="124" fill="#10b981" font-family="monospace" font-size="11">
      • Transformed Wire: [0x7F, 0x9F, 0x4D, 0x51, 0x58]  (Neutralizes Proxy Cache Poisoning)
    </text>
  </g>
</svg>
