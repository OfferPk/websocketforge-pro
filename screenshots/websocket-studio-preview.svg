<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1329" stroke="#2a3a53" stroke-width="1"/>
  <rect x="30" y="15" width="65" height="40" rx="8" fill="url(#purpleCyan)"/>
  <text x="62" y="41" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="11" text-anchor="middle">WS/WSS</text>
  <text x="108" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20">WebSocketForge <tspan fill="#8b5cf6">Pro</tspan></text>
  <text x="108" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">IETF RFC 6455 Wireframe Dissector &amp; CSWSH Security Studio</text>

  <!-- Profile Tag -->
  <rect x="860" y="20" width="310" height="32" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="875" y="41" fill="#8b5cf6" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">FinTech Trading Desk (Zero-Trust WSS)</text>

  <!-- Sidebar (Left) -->
  <rect x="30" y="90" width="320" height="555" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="50" y="125" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">WebSocket Frame Forger</text>

  <rect x="50" y="145" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">TRANSMISSION DIRECTION</text>
  <text x="65" y="183" fill="#8b5cf6" font-family="monospace" font-size="12" font-weight="700">Client to Server (Masked - RFC 6455)</text>

  <rect x="50" y="210" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="230" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">FRAME OPCODE</text>
  <text x="65" y="248" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700">0x1 Text Frame (UTF-8) | FIN=1</text>

  <rect x="50" y="275" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">4-BYTE MASKING KEY</text>
  <text x="65" y="313" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">0x37FA213D (Client Nonce)</text>

  <rect x="50" y="340" width="280" height="75" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">APPLICATION PAYLOAD</text>
  <text x="65" y="380" fill="#a7f3d0" font-family="monospace" font-size="11">{"action":"subscribe","channel":"BTC"}</text>
  <text x="65" y="400" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Length: 37 Bytes (Direct 7-bit)</text>

  <text x="50" y="450" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Zero-Trust WebSocket Controls</text>
  <text x="70" y="480" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Anti-CSWSH Origin Whitelist</text>
  <text x="70" y="510" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Mandatory WSS (TLS 1.3 Port 443)</text>
  <text x="70" y="540" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Client Frame Masking Enforced</text>
  <text x="70" y="570" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Ping/Pong Dead Socket Pruning</text>
  <text x="70" y="600" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Strict RFC 3629 UTF-8 Validation</text>

  <!-- Right Dashboard -->
  <!-- 4 KPI Cards -->
  <rect x="375" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="390" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">FRAME OPCODE</text>
  <text x="390" y="142" fill="#8b5cf6" font-family="monospace" font-size="20" font-weight="700">0x1 (TEXT)</text>
  <text x="390" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">FIN=1 | MASK=1</text>

  <rect x="575" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="590" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">WIRE FRAME SIZE</text>
  <text x="590" y="142" fill="#06b6d4" font-family="monospace" font-size="22" font-weight="700">101 Bytes</text>
  <text x="590" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Ethernet II + TCP</text>

  <rect x="775" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="790" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">MASKING KEY</text>
  <text x="790" y="142" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="700">0x37FA213D</text>
  <text x="790" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">4-Byte XOR Mask</text>

  <rect x="975" y="90" width="195" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="990" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ZERO-TRUST AUDIT</text>
  <text x="990" y="142" fill="#10b981" font-family="monospace" font-size="22" font-weight="700">100/100</text>
  <text x="990" y="162" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Grade A+ (Certified)</text>

  <!-- Packet Dissector & Hex Dump -->
  <rect x="375" y="195" width="795" height="450" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="400" y="230" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Bit-Accurate Binary Frame Dissector &amp; Wireshark Hex Dump</text>

  <rect x="400" y="250" width="745" height="150" rx="6" fill="#080d1a" stroke="#2a3a53"/>
  <text x="415" y="275" fill="#38bdf8" font-family="monospace" font-size="11">0000   00 aa bb cc dd ee 00 1a 2b 3c 4d 5e 08 00 45 00</text>
  <text x="415" y="295" fill="#38bdf8" font-family="monospace" font-size="11">0010   00 57 7b 2a 40 00 40 06 db a5 c0 a8 01 32 0a 00</text>
  <text x="415" y="315" fill="#38bdf8" font-family="monospace" font-size="11">0020   00 01 c8 22 01 bb 30 00 00 01 40 00 00 01 50 18</text>
  <text x="415" y="335" fill="#38bdf8" font-family="monospace" font-size="11">0030   fa f0 a8 4b 00 00 81 a5 37 fa 21 3d 4c 9b 40 51</text>
  <text x="415" y="355" fill="#38bdf8" font-family="monospace" font-size="11">0040   58 95 4f 53 55 9b 53 53 43 9b 4d 52 50 89 53 4e</text>
  <text x="415" y="375" fill="#38bdf8" font-family="monospace" font-size="11">0050   55 99 43 5f 55 9b 47 53 45 9b 4d 49 53 8d 51 fc</text>

  <!-- Live Handshake Derivation Box -->
  <rect x="400" y="415" width="745" height="100" rx="6" fill="#0f172a" stroke="#2a3a53"/>
  <text x="415" y="440" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">RFC 6455 HANDSHAKE KEY DERIVATION</text>
  <text x="415" y="465" fill="#f1f5f9" font-family="monospace" font-size="12">Key: dGhlIHNhbXBsZSBub25jZQ== + 258EAFA5-E914-47DA-95CA-C5AB0DC85B11</text>
  <text x="415" y="495" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">✓ Sec-WebSocket-Accept = s3pPLMBiTxaQ9kYGzzhZRbK+xOo= (SHA-1 + Base64)</text>

  <!-- Synthesizer Snippet -->
  <rect x="400" y="525" width="745" height="100" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="415" y="548" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SYNTHESIZED SECURE SERVER (Node.js / ws v8+)</text>
  <text x="415" y="570" fill="#8b5cf6" font-family="monospace" font-size="11">verifyClient: (info, cb) =&gt; { if (!ALLOWED_ORIGINS.has(info.origin)) return cb(false, 403); }</text>
  <text x="415" y="590" fill="#94a3b8" font-family="monospace" font-size="11">setInterval(() =&gt; { wss.clients.forEach(ws =&gt; { if (!ws.isAlive) ws.terminate(); }); }, 30000);</text>
</svg>
